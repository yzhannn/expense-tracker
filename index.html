<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>首頁</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px 16px 90px 16px;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .month-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .month-btn {
      width: auto;
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      background: #2f6fed;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .month-title {
      font-size: 20px;
      font-weight: bold;
    }

    .total-amount {
      font-size: 32px;
      font-weight: bold;
      color: #2f6fed;
      margin-top: 8px;
    }

    .expense-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .expense-item:last-child {
      border-bottom: none;
    }

    .expense-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: bold;
    }

    .expense-bottom {
      margin-top: 4px;
      color: #666;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .empty-text {
      color: #777;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background: #fff;
      border-top: 1px solid #ddd;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 999;
    }

    .nav-link {
      text-align: center;
      padding: 10px 6px;
      text-decoration: none;
      color: #333;
      font-size: 13px;
    }

    .nav-link.active {
      color: #2f6fed;
      font-weight: bold;
    }

    .status-box {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f1f1f1;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
    }

    .chart-wrapper {
      max-width: 420px;
      margin: 0 auto 20px auto;
    }

    .category-list {
      margin-top: 12px;
    }

    .category-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .category-item:last-child {
      border-bottom: none;
    }

    @media (max-width: 600px) {
      .month-title {
        font-size: 18px;
      }

      .total-amount {
        font-size: 28px;
      }

      .nav-link {
        font-size: 12px;
        padding: 10px 4px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>首頁</h1>
      <div class="month-bar">
        <button class="month-btn" id="prevMonthBtn">←</button>
        <div class="month-title" id="monthTitle">載入中...</div>
        <button class="month-btn" id="nextMonthBtn">→</button>
      </div>
    </div>

    <div class="card">
      <h2>當月總花費</h2>
      <div class="total-amount" id="monthlyTotal">NT$ 0</div>
    </div>

    <div class="card">
      <h2>當月花費比例</h2>
      <div class="chart-wrapper">
        <canvas id="expensePieChart"></canvas>
      </div>
      <div id="categoryList" class="category-list"></div>
    </div>

    <div class="card">
      <h2>最近 5 筆花費</h2>
      <div id="recentExpenses">
        <div class="empty-text">載入中...</div>
      </div>
    </div>

    <div class="card">
      <h3>狀態</h3>
      <div class="status-box" id="statusBox">準備中...</div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-link" href="add-shopping.html">新增購買提醒</a>
    <a class="nav-link" href="add-expense.html">新增花費</a>
    <a class="nav-link active" href="index.html">首頁</a>
    <a class="nav-link" href="shopping-list.html">顯示購買清單</a>
    <a class="nav-link" href="monthly-report.html">月統計</a>
  </nav>

  <script>
    const API_BASE = "https://script.google.com/macros/s/AKfycbxK9v6rawgtx5F3_MxmKpNipqtD6zta9pgiWvpz-nKddRMF4ILkQMwMIaD8BljsfGlR/exec";

    let allExpenses = [];
    let currentYear;
    let currentMonth;
    let pieChart = null;

    const chartColors = [
      "#2f6fed",
      "#f59e0b",
      "#10b981",
      "#ef4444",
      "#8b5cf6",
      "#06b6d4",
      "#f97316",
      "#84cc16",
      "#ec4899",
      "#6b7280"
    ];

    function initCurrentMonth() {
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth();
    }

    function updateMonthTitle() {
      const monthTitle = document.getElementById("monthTitle");
      monthTitle.textContent = currentYear + " 年 " + (currentMonth + 1) + " 月";
    }

    async function loadExpenses() {
      const statusBox = document.getElementById("statusBox");
      try {
        statusBox.textContent = "開始讀取花費資料...";
        const response = await fetch(API_BASE + "?action=getExpenses");
        allExpenses = await response.json();
        statusBox.textContent = "成功：已讀取花費資料";
        renderHome();
      } catch (error) {
        statusBox.textContent = "讀取失敗：" + error.message;
        console.error(error);
      }
    }

    function getCurrentMonthExpenses() {
      return allExpenses.filter(function(item) {
        const d = new Date(item.date);
        return !isNaN(d.getTime()) && d.getFullYear() === currentYear && d.getMonth() === currentMonth;
      });
    }

    function renderHome() {
      updateMonthTitle();
      renderMonthlyTotal();
      renderPieChart();
      renderRecentExpenses();
    }

    function renderMonthlyTotal() {
      const monthlyTotalEl = document.getElementById("monthlyTotal");
      const currentExpenses = getCurrentMonthExpenses();

      const total = currentExpenses.reduce(function(sum, item) {
        return sum + Number(item.amount || 0);
      }, 0);

      monthlyTotalEl.textContent = "NT$ " + total;
    }

    function renderPieChart() {
      const currentExpenses = getCurrentMonthExpenses();
      const categoryMap = {};
      const categoryListEl = document.getElementById("categoryList");

      currentExpenses.forEach(function(item) {
        const category = item.category || "未分類";
        categoryMap[category] = (categoryMap[category] || 0) + Number(item.amount || 0);
      });

      const labels = Object.keys(categoryMap);
      const data = Object.values(categoryMap);
      const total = data.reduce(function(sum, value) {
        return sum + value;
      }, 0);

      if (pieChart) {
        pieChart.destroy();
      }

      const ctx = document.getElementById("expensePieChart").getContext("2d");

      if (labels.length === 0) {
        categoryListEl.innerHTML = '<div class="empty-text">這個月目前沒有花費資料</div>';
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        return;
      }

            pieChart = new Chart(ctx, {
        type: "pie",
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: chartColors.slice(0, labels.length)
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: "bottom"
            },
            datalabels: {
              color: "#222",
              font: {
                weight: "bold",
                size: 12
              },
              formatter: function(value, context) {
                const total = context.chart.data.datasets[0].data.reduce(function(sum, val) {
                  return sum + val;
                }, 0);
                const percent = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                const label = context.chart.data.labels[context.dataIndex];
                return label + " " + percent + "%";
              }
            }
          }
        },
        plugins: [ChartDataLabels]
      });

      categoryListEl.innerHTML = "";

      labels.forEach(function(label, index) {
        const amount = data[index];
        const percent = total > 0 ? ((amount / total) * 100).toFixed(1) : 0;

        const row = document.createElement("div");
        row.className = "category-item";
        row.innerHTML = `
          <span>${label}</span>
          <span>NT$ ${amount}（${percent}%）</span>
        `;
        categoryListEl.appendChild(row);
      });
    }

    function renderRecentExpenses() {
      const recentExpensesEl = document.getElementById("recentExpenses");
      const filtered = getCurrentMonthExpenses();

      filtered.sort(function(a, b) {
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      const recentFive = filtered.slice(0, 5);

      if (recentFive.length === 0) {
        recentExpensesEl.innerHTML = '<div class="empty-text">這個月目前沒有花費資料</div>';
        return;
      }

      recentExpensesEl.innerHTML = "";

      recentFive.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "expense-item";
        div.innerHTML = `
          <div class="expense-top">
            <span>${item.note || "未填寫備註"}</span>
            <span>NT$ ${item.amount}</span>
          </div>
          <div class="expense-bottom">
            <span>${formatDate(item.date)}</span>
            <span>${item.category || ""} / ${item.user || ""}</span>
          </div>
        `;
        recentExpensesEl.appendChild(div);
      });
    }

    function formatDate(value) {
      const d = new Date(value);
      if (isNaN(d.getTime())) return value;
      return d.toLocaleDateString("zh-TW");
    }

    document.getElementById("prevMonthBtn").addEventListener("click", function() {
      currentMonth--;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      renderHome();
    });

    document.getElementById("nextMonthBtn").addEventListener("click", function() {
      currentMonth++;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      renderHome();
    });

    initCurrentMonth();
    updateMonthTitle();
    loadExpenses();
  </script>
</body>
</html>
