<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記帳測試頁</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f7fb;
      color: #222;
    }
    .box {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 12px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      background: #2f6fed;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    pre {
      background: #eee;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>記帳測試頁</h1>
    <p>先確認網站能不能讀取 Google Apps Script 資料。</p>
  </div>

  <div class="box">
    <h2>Settings</h2>
    <pre id="settingsBox">載入中...</pre>
  </div>

  <div class="box">
    <h2>Categories</h2>
    <pre id="categoriesBox">載入中...</pre>
  </div>

  <div class="box">
    <h2>新增花費</h2>

    <label>日期</label>
    <input type="date" id="expenseDate">

    <label>金額</label>
    <input type="number" id="expenseAmount" placeholder="例如 120">

    <label>類別</label>
    <select id="expenseCategory"></select>

    <label>備註</label>
    <input type="text" id="expenseNote" placeholder="例如 午餐">

    <label>使用者</label>
    <select id="expenseUser"></select>

    <button id="addExpenseBtn">新增花費</button>

    <h3>結果</h3>
    <pre id="resultBox">尚未操作</pre>
  </div>

  <script>
    const API_BASE = 'https://script.google.com/macros/s/AKfycbxK9v6rawgtx5F3_MxmKpNipqtD6zta9pgiWvpz-nKddRMF4ILkQMwMIaD8BljsfGlR/exec';

    const settingsBox = document.getElementById('settingsBox');
    const categoriesBox = document.getElementById('categoriesBox');
    const resultBox = document.getElementById('resultBox');
    const expenseCategory = document.getElementById('expenseCategory');
    const expenseUser = document.getElementById('expenseUser');
    const expenseDate = document.getElementById('expenseDate');

    expenseDate.value = new Date().toISOString().split('T')[0];

    async function fetchJson(url) {
      const response = await fetch(url);
      const text = await response.text();
      return JSON.parse(text);
    }

    async function postJson(data) {
      const response = await fetch(API_BASE, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(data)
      });
      const text = await response.text();
      return JSON.parse(text);
    }

    async function loadData() {
      try {
        const settings = await fetchJson(API_BASE + '?action=getSettings');
        settingsBox.textContent = JSON.stringify(settings, null, 2);

        const users = [settings.user1_name, settings.user2_name].filter(Boolean);
        expenseUser.innerHTML = '';
        users.forEach(function(user) {
          const option = document.createElement('option');
          option.value = user;
          option.textContent = user;
          expenseUser.appendChild(option);
        });

        const categories = await fetchJson(API_BASE + '?action=getCategories');
        categoriesBox.textContent = JSON.stringify(categories, null, 2);

        expenseCategory.innerHTML = '';
        categories.forEach(function(cat) {
          const option = document.createElement('option');
          option.value = cat.name;
          option.textContent = cat.name;
          expenseCategory.appendChild(option);
        });

        resultBox.textContent = '資料讀取成功';
      } catch (error) {
        resultBox.textContent = '讀取失敗：' + error.message;
        console.error(error);
      }
    }

    document.getElementById('addExpenseBtn').addEventListener('click', async function() {
      try {
        const payload = {
          action: 'addExpense',
          date: document.getElementById('expenseDate').value,
          amount: document.getElementById('expenseAmount').value,
          category: document.getElementById('expenseCategory').value,
          note: document.getElementById('expenseNote').value,
          user: document.getElementById('expenseUser').value
        };

        const result = await postJson(payload);
        resultBox.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        resultBox.textContent = '新增失敗：' + error.message;
        console.error(error);
      }
    });

    loadData();
  </script>
</body>
</html>
