<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下拉選單測試</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f7fb;
    }
    .box {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    pre {
      background: #eee;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>下拉選單測試</h1>
    <p>這一頁測試使用者與類別能不能放進下拉選單。</p>
  </div>

  <div class="box">
    <h2>使用者</h2>
    <select id="userSelect">
      <option>載入中...</option>
    </select>
  </div>

  <div class="box">
    <h2>類別</h2>
    <select id="categorySelect">
      <option>載入中...</option>
    </select>
  </div>

  <div class="box">
    <h2>狀態</h2>
    <pre id="statusBox">準備中...</pre>
  </div>

  <script>
    const API_BASE = "https://script.google.com/macros/s/AKfycbxK9v6rawgtx5F3_MxmKpNipqtD6zta9pgiWvpz-nKddRMF4ILkQMwMIaD8BljsfGlR/exec";

    async function loadDropdowns() {
      const userSelect = document.getElementById("userSelect");
      const categorySelect = document.getElementById("categorySelect");
      const statusBox = document.getElementById("statusBox");

      try {
        statusBox.textContent = "開始讀取 Settings...";
        const settingsResponse = await fetch(API_BASE + "?action=getSettings");
        const settings = await settingsResponse.json();

        userSelect.innerHTML = "";
        const users = [settings.user1_name, settings.user2_name].filter(Boolean);

        users.forEach(function(user) {
          const option = document.createElement("option");
          option.value = user;
          option.textContent = user;
          userSelect.appendChild(option);
        });

        statusBox.textContent = "開始讀取 Categories...";
        const categoriesResponse = await fetch(API_BASE + "?action=getCategories");
        const categories = await categoriesResponse.json();

        categorySelect.innerHTML = "";

        categories.forEach(function(category) {
          const option = document.createElement("option");
          option.value = category.name;
          option.textContent = category.name;
          categorySelect.appendChild(option);
        });

        statusBox.textContent = "成功：下拉選單已載入";
      } catch (error) {
        statusBox.textContent = "失敗：" + error.message;
        console.error(error);
      }
    }

    loadDropdowns();
  </script>
</body>
</html>
